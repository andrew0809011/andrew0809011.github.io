<svg width="180" height="44" viewBox="0 0 180 44" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0060FF"/>
      <stop offset="100%" stop-color="#0034FF"/>
    </linearGradient>
  </defs>

  <!-- Icon: gradient rounded square -->
  <rect x="2" y="2" width="40" height="40" rx="11" fill="url(#g)"/>
  <!-- Subtle top highlight for depth -->
  <rect x="2" y="2" width="40" height="20" rx="11" fill="white" opacity="0.08"/>

  <!-- Icon: geometric "A" — two legs + crossbar + apex node -->
  <polyline
    points="13,34 22,11 31,34"
    fill="none" stroke="white" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="16.5" y1="25" x2="27.5" y2="25"
    stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="22" cy="11" r="2.2" fill="white"/>

  <!-- Brand text -->
  <text
    x="52" y="27"
    font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="16"
    font-weight="600"
    fill="#0F172A">Andrew's Blog</text>
</svg>
